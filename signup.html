<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spoty Bet Predator · Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,sans-serif}
  body{
    background:#0a0a0a;
    color:#fff;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:1.5rem;
    background-image:
      radial-gradient(800px 500px at 15% -10%, rgba(255,255,255,.05), transparent 60%),
      radial-gradient(700px 400px at 110% 100%, rgba(255,255,255,.04), transparent 60%);
  }
  .auth-card{
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.1);
    border-radius:24px;
    padding:2.5rem 2rem 2rem;
    width:100%;
    max-width:420px;
    box-shadow:0 30px 80px rgba(0,0,0,.6);
    backdrop-filter:blur(20px);
  }
  .auth-brand{
    display:flex;
    align-items:center;
    gap:.65rem;
    margin-bottom:2rem;
    justify-content:center;
  }
  .brand-mark{
    width:42px;height:42px;border-radius:12px;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    color:#000;font-size:1.1rem;
  }
  .auth-brand h1{font-size:1.1rem;font-weight:900;letter-spacing:-.02em}
  .auth-brand h1 span{
    background:#fff;color:#000;
    padding:.05rem .4rem;border-radius:6px;
    margin-left:.2rem;
  }
  .auth-card h2{
    font-size:1.6rem;font-weight:900;letter-spacing:-.03em;
    margin-bottom:.4rem;text-align:center;
  }
  .auth-card .sub{
    font-size:.8rem;color:#888;font-weight:600;
    text-align:center;margin-bottom:2rem;line-height:1.5;
  }
  .field{margin-bottom:1rem}
  .field label{
    display:flex;align-items:center;gap:.4rem;
    font-size:.68rem;font-weight:700;
    color:#aaa;margin-bottom:.5rem;
    letter-spacing:.3px;
  }
  .field label i{font-size:.7rem;color:#666}
  .field input{
    width:100%;background:rgba(0,0,0,.4);
    border:1px solid rgba(255,255,255,.1);
    border-radius:12px;padding:.85rem 1rem;
    color:#fff;font-size:.9rem;font-weight:500;
    outline:none;transition:.2s;
    font-family:inherit;
  }
  .field input::placeholder{color:#555;font-weight:500}
  .field input:focus{
    border-color:#fff;
    background:rgba(0,0,0,.6);
    box-shadow:0 0 0 4px rgba(255,255,255,.06);
  }
  .btn-gold{
    width:100%;padding:.9rem;border-radius:12px;
    background:#fff;
    color:#000;font-weight:800;font-size:.85rem;
    letter-spacing:.3px;
    transition:.2s;cursor:pointer;border:none;
    display:flex;align-items:center;justify-content:center;gap:.5rem;
    font-family:inherit;
    margin-top:.5rem;
  }
  .btn-gold:hover{background:#e5e5e5;transform:translateY(-1px)}
  .btn-gold:active{transform:translateY(0)}
  .btn-gold:disabled{opacity:.5;cursor:wait;transform:none}
  .msg{
    margin-top:1rem;font-size:.78rem;font-weight:600;
    text-align:center;min-height:1.2rem;
  }
  .msg.err{color:#ff6b6b}
  .msg.ok{color:#6bffa3}
  .switch-line{
    margin-top:1.5rem;text-align:center;font-size:.78rem;
    color:#888;font-weight:500;
  }
  .switch-line a{color:#fff;text-decoration:none;font-weight:800}
  .switch-line a:hover{text-decoration:underline}
  .tg-footer{
    margin-top:1.8rem;padding-top:1.4rem;
    border-top:1px solid rgba(255,255,255,.08);
    text-align:center;
  }
  .tg-footer a{
    display:inline-flex;align-items:center;gap:.45rem;
    color:#888;font-size:.72rem;font-weight:700;
    text-decoration:none;
    transition:.15s;
  }
  .tg-footer a:hover{color:#fff}
  .tg-footer a i{font-size:.9rem}
</style>
</head>
<body>

<div class="auth-card">
  <div class="auth-brand">
    <div class="brand-mark"><i class="fa-solid fa-basketball"></i></div>
    <h1>SPOTY BET <span>PREDATOR</span></h1>
  </div>

  <h2>Create Account</h2>
  <p class="sub">Join the predator side. Real odds, real picks. People winning Sporty Loosing</p>
  
  
  <form id="signupForm">
    <div class="field">
      <label><i class="fa-solid fa-user"></i> Username</label>
      <input type="text" id="username" placeholder="Pick A User Name" autocomplete="username" required>
    </div>
    <div class="field">
      <label><i class="fa-solid fa-envelope"></i> Email</label>
      <input type="email" id="email" placeholder="Email is used for Verification" autocomplete="email" required>
    </div>
    <div class="field">
      <label><i class="fa-solid fa-lock"></i> Password</label>
      <input type="password" id="password" placeholder="min 6 characters" autocomplete="new-password" minlength="6" required>
    </div>
    <button type="submit" class="btn-gold" id="submitBtn">
      <i class="fa-solid fa-user-plus"></i> Create Account
    </button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="switch-line">
    Got an account? <a href="/login">Log in</a>
  </div>

  <div class="tg-footer">
    <a href="https://t.me/NEX_TECH_CHANNEL" target="_blank" rel="noopener">
      <i class="fa-brands fa-telegram"></i> Join my channel
    </a>
  </div>
</div>

<script>
const form = document.getElementById('signupForm');
const msg = document.getElementById('msg');
const btn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.textContent = '';
  msg.className = 'msg';
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating...';

  const username = document.getElementById('username').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    const res = await fetch('/api/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email, password })
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || 'Something went wrong bruu');
    }

    msg.textContent = '✓ Account created! Redirecting...';
    msg.className = 'msg ok';

    sessionStorage.setItem('sbp_welcome', username);

    setTimeout(() => {
      window.location.href = '/login';
    }, 1200);

  } catch (err) {
    msg.textContent = '✗ ' + err.message;
    msg.className = 'msg err';
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account';
  }
});
</script>

</body>
</html>
